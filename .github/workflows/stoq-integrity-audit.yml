name: STOQ integrity audit
on:
  push:
    paths:
      - 'stoq_integrity_audit.py'
      - '.github/workflows/stoq-integrity-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python stoq_integrity_audit.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stoq_integrity_report.txt
          git diff --cached --quiet || git commit -m 'Generate STOQ integrity audit report'
          git push
