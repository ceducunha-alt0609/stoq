name: STOQ concise findings scan
on:
  push:
    paths:
      - 'stoq_findings_scan.py'
      - '.github/workflows/stoq-findings-scan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python stoq_findings_scan.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stoq_findings.txt
          git diff --cached --quiet || git commit -m 'Generate concise STOQ findings'
          git push
