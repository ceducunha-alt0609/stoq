name: STOQ reset security patch
on:
  push:
    paths:
      - 'stoq_reset_security_patch.py'
      - '.github/workflows/stoq-reset-security-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python stoq_reset_security_patch.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          w=Path('sw.js').read_text()
          assert "localStorage.setItem('ec2_items','[]')" in s
          assert "SP.set('jbKey','')" in s
          assert "SP.set('sbKey','')" in s
          assert 'stoq-pro-v2-5-reset-cleanup' in w
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Fix STOQ reset and credential cleanup'
          git push
